name: Publish an authenticated tested release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version whose public signed manifest is committed under release-manifests'
        type: string
        required: true
      run_id:
        description: 'Successful push/main Windows build used to stage the draft assets'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-authenticated-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yuuma1on/yuu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      APP_VERSION: ${{ inputs.version }}
      BUILD_RUN: ${{ inputs.run_id }}
    steps:
      - name: Validate the tested source and unpublished draft
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == 'yuuma1on/yuu' ]]
          [[ "$BUILD_RUN" =~ ^[0-9]{1,20}$ ]]
          [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          RELEASE_WORKSPACE="$RUNNER_TEMP/pulse-publish"
          printf 'RELEASE_WORKSPACE=%s\n' "$RELEASE_WORKSPACE" >> "$GITHUB_ENV"
          mkdir "$RELEASE_WORKSPACE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > "$RELEASE_WORKSPACE/build.json"
          jq -e '.status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main" and .path == ".github/workflows/release.yml" and .repository.full_name == "yuuma1on/yuu" and .head_repository.full_name == "yuuma1on/yuu"' "$RELEASE_WORKSPACE/build.json" >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?filter=latest" > "$RELEASE_WORKSPACE/jobs.json"
          jq -e '([.jobs[] | select(.name == "build" and .status == "completed" and .conclusion == "success")] | length == 1)' "$RELEASE_WORKSPACE/jobs.json" >/dev/null
          commit=$(jq -r .head_sha "$RELEASE_WORKSPACE/build.json")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          ancestry=$(gh api "repos/$GH_REPO/compare/$commit...main" --jq '.status')
          [[ "$ancestry" == 'ahead' || "$ancestry" == 'identical' ]]
          gh api "repos/$GH_REPO/contents/package.json?ref=$commit" --jq '.content' | base64 --decode > "$RELEASE_WORKSPACE/tested-package.json"
          [[ "$(jq -r .version "$RELEASE_WORKSPACE/tested-package.json")" == "$APP_VERSION" ]]
          tag="v$APP_VERSION"
          gh api "repos/$GH_REPO/releases/tags/$tag" > "$RELEASE_WORKSPACE/draft.json"
          installer="PULSE-Setup-$APP_VERSION-x64.exe"
          jq -e --arg commit "$commit" --arg tag "$tag" --arg installer "$installer" '.draft == true and .prerelease == false and .target_commitish == $commit and .tag_name == $tag and (.assets | length == 3) and ([.assets[].name] | sort) == ([$installer, ($installer + ".blockmap"), "latest.yml"] | sort) and all(.assets[]; .state == "uploaded" and .size > 0)' "$RELEASE_WORKSPACE/draft.json" >/dev/null
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RELEASE_WORKSPACE/tag.json" 2> "$RELEASE_WORKSPACE/tag-error.txt"; then
            tag_commit=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
            [[ "$tag_commit" == "$commit" ]]
          else
            jq -e '.status == "404"' "$RELEASE_WORKSPACE/tag.json" >/dev/null
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'Validated tested commit %s for unpublished %s.\n' "$commit" "$tag"

      - name: Check out the dispatch commit on main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install locked verification dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Download the existing tested draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          installer="PULSE-Setup-$APP_VERSION-x64.exe"
          gh release download "v$APP_VERSION" --pattern "$installer" --pattern "$installer.blockmap" --pattern latest.yml --dir "$RELEASE_WORKSPACE/assets"

      - name: Verify the committed signed envelope and exact draft bytes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {createRequire} from 'node:module';
          import {parseDocument} from 'yaml';
          const require = createRequire(import.meta.url);
          const {verifyEnvelope, verifyBytes, verifyUpdateInfo, verifyInstaller} = require('./desktop/update-manifest.cjs');
          const version = process.env.APP_VERSION;
          const root = process.env.RELEASE_WORKSPACE;
          const assets = path.join(root, 'assets');
          const manifestPath = `release-manifests/v${version}.json`;
          const notesPath = `release-manifests/v${version}-notes.txt`;
          for (const filename of [manifestPath, notesPath]) {
            const info = await fs.lstat(filename);
            assert(info.isFile() && !info.isSymbolicLink() && info.size > 0, 'Expected committed regular manifest and notes files');
          }
          const envelope = await fs.readFile(manifestPath);
          const trustedKey = await fs.readFile('desktop/update-public-key.pem');
          const signed = verifyEnvelope(envelope, trustedKey, {currentVersion: '0.0.0'});
          assert.equal(signed.manifest.version, version);
          const installerName = `PULSE-Setup-${version}-x64.exe`;
          const expected = [installerName, `${installerName}.blockmap`, 'latest.yml'].sort();
          assert.deepEqual((await fs.readdir(assets)).sort(), expected, 'Unexpected draft assets');
          const draft = JSON.parse(await fs.readFile(path.join(root, 'draft.json'), 'utf8'));
          for (const name of expected) {
            const info = await fs.lstat(path.join(assets, name));
            const remote = draft.assets.find(asset => asset.name === name);
            assert(info.isFile() && !info.isSymbolicLink() && info.size > 0 && info.size === remote?.size, 'Draft asset size/type mismatch');
          }
          const metadata = await fs.readFile(path.join(assets, 'latest.yml'));
          verifyBytes(metadata, signed.manifest.latestYml);
          const document = parseDocument(metadata.toString('utf8'), {uniqueKeys: true, schema: 'core'});
          assert.equal(document.errors.length, 0, 'Invalid YAML');
          assert.equal(document.warnings.length, 0, 'Ambiguous YAML');
          verifyUpdateInfo(document.toJS({maxAliasCount: 0}), signed.manifest);
          await verifyInstaller(path.join(assets, installerName), signed.manifest.installer, assets);
          await fs.copyFile(manifestPath, path.join(assets, 'pulse-update.json'), fs.constants.COPYFILE_EXCL);
          console.log(JSON.stringify({version, signatureVerified: true, metadataVerified: true, installerVerified: true, manifestSha256: crypto.createHash('sha256').update(envelope).digest('hex')}));
          NODE

      - name: Attach only the authenticated manifest and publish the complete draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_COMMIT: ${{ steps.validate.outputs.commit }}
        run: |
          set -euo pipefail
          tag="v$APP_VERSION"
          installer="PULSE-Setup-$APP_VERSION-x64.exe"
          gh api "repos/$GH_REPO/releases/tags/$tag" > "$RELEASE_WORKSPACE/before-upload.json"
          jq -e --arg commit "$TESTED_COMMIT" --slurpfile original "$RELEASE_WORKSPACE/draft.json" '.draft == true and .target_commitish == $commit and (.assets | length == 3) and all(.assets[]; .name != "pulse-update.json") and ([.assets[] | {id,name,size,digest,updated_at}] | sort_by(.name)) == ([$original[0].assets[] | {id,name,size,digest,updated_at}] | sort_by(.name))' "$RELEASE_WORKSPACE/before-upload.json" >/dev/null
          gh release upload "$tag" "$RELEASE_WORKSPACE/assets/pulse-update.json"
          gh api "repos/$GH_REPO/releases/tags/$tag" > "$RELEASE_WORKSPACE/complete-draft.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const root = process.env.RELEASE_WORKSPACE;
          const version = process.env.APP_VERSION;
          const draft = JSON.parse(await fs.readFile(path.join(root, 'complete-draft.json'), 'utf8'));
          const original = JSON.parse(await fs.readFile(path.join(root, 'draft.json'), 'utf8'));
          const installer = `PULSE-Setup-${version}-x64.exe`;
          const expected = [installer, `${installer}.blockmap`, 'latest.yml', 'pulse-update.json'].sort();
          assert.equal(draft.draft, true);
          assert.equal(draft.prerelease, false);
          assert.equal(draft.tag_name, `v${version}`);
          assert.equal(draft.target_commitish, process.env.TESTED_COMMIT);
          assert.deepEqual(draft.assets.map(asset => asset.name).sort(), expected);
          for (const asset of draft.assets) {
            assert.equal(asset.state, 'uploaded');
            assert.equal(asset.size, (await fs.stat(path.join(root, 'assets', asset.name))).size);
            if (asset.name !== 'pulse-update.json') {
              const before = original.assets.find(entry => entry.name === asset.name);
              assert(before, 'Unexpected original asset');
              for (const key of ['id', 'size', 'digest', 'updated_at']) assert.equal(asset[key], before[key], 'Original draft asset changed during verification');
            }
          }
          NODE
          gh release download "$tag" --pattern pulse-update.json --dir "$RELEASE_WORKSPACE/manifest-roundtrip"
          cmp "$RELEASE_WORKSPACE/assets/pulse-update.json" "$RELEASE_WORKSPACE/manifest-roundtrip/pulse-update.json"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RELEASE_WORKSPACE/final-tag.json" 2> "$RELEASE_WORKSPACE/final-tag-error.txt"; then
            tag_commit=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
            [[ "$tag_commit" == "$TESTED_COMMIT" ]]
          else
            jq -e '.status == "404"' "$RELEASE_WORKSPACE/final-tag.json" >/dev/null
          fi
          gh release edit "$tag" --notes-file "release-manifests/v$APP_VERSION-notes.txt" --draft=false --latest
