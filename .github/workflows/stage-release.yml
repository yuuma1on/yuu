name: Stage tested assets in a release draft

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful main Windows build containing the tested assets'
        type: string
        required: true
      version:
        description: 'Exact stable package version in that tested commit'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: stage-release-draft
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'yuuma1on/yuu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate the successful main build and stage only its three assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == 'yuuma1on/yuu' ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh run view "$BUILD_RUN" --json headSha,headBranch,event,conclusion,workflowName,jobs > run.json
          jq -e '.headBranch == "main" and .event == "push" and .conclusion == "success" and .workflowName == "Windows build and release" and ([.jobs[] | select(.name == "build" and .conclusion == "success")] | length == 1)' run.json >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '{path,status}' > identity.json
          jq -e '.path == ".github/workflows/release.yml" and .status == "completed"' identity.json >/dev/null
          commit=$(jq -r .headSha run.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          ancestry=$(gh api "repos/$GH_REPO/compare/$commit...main" --jq '.status')
          [[ "$ancestry" == 'ahead' || "$ancestry" == 'identical' ]]
          gh api "repos/$GH_REPO/contents/package.json?ref=$commit" --jq '.content' | base64 --decode > tested-package.json
          [[ "$(jq -r .version tested-package.json)" == "$APP_VERSION" ]]
          tag="v$APP_VERSION"
          tag_count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq "map(select(.ref == \"refs/tags/$tag\")) | length")
          if [[ "$tag_count" != '0' ]]; then
            [[ "$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')" == "$commit" ]]
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'A release already exists. Drafts and published releases are never overwritten.' >&2
            exit 1
          fi
          gh run download "$BUILD_RUN" --name pulse-unsigned-windows --dir assets
          installer="PULSE-Setup-$APP_VERSION-x64.exe"
          expected=$(printf '%s\n' "$installer" "$installer.blockmap" latest.yml | sort)
          actual=$(find assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "$actual" == "$expected" ]]
          for name in "$installer" "$installer.blockmap" latest.yml; do
            [[ -s "assets/$name" && ! -L "assets/$name" ]]
          done
          printf 'Tested source: %s\nWindows build: https://github.com/%s/actions/runs/%s\n' "$commit" "$GH_REPO" "$BUILD_RUN"
          sha256sum "assets/$installer" assets/latest.yml
          gh release create "$tag" --target "$commit" --draft --title "PULSE $APP_VERSION" \
            --notes 'Signed update manifest pending. This draft must remain unpublished.' \
            "assets/$installer" "assets/$installer.blockmap" assets/latest.yml
          gh release view "$tag" --json isDraft,assets --jq '{isDraft,assets:[.assets[]|{name,size,state}]}'
